<!DOCTYPE html>
<html lang="pl-PL">
<head>
<meta charset="utf-8">
<title>Zadanie 9 - Halyna</title>
<script type="text/javascript">
  function show_prompt()
  {
    var name=prompt("Napisz imię","Imię Nazwisko");
    if (name!=null && name!="")
    {
      document.write("Witaj " + name + "! jak się masz?");
      document.write("<br><br><input type=\"button\" value=\"zamknij okno\" onclick=\"window.close()\" />");
    }
  }
</script>
</head>
<body>
<b>Zastosowanie:</b><br>
Jest używany kiedy użytkownik ma wpisać coś np. zanim wejdzie w dany moduł strony. Np. hasło.<br>
Użytkownik po wpisaniu wartości może nacisnąć „OK.” albo „Cancel”.<br>
Jeżeli użytkownik kliknie „OK.” metoda zwraca wpisaną wartość, a w przeciwnym wypadku zwraca null.<br>
<input type="button" onclick="show_prompt()" value="Pokaż prompt box" />
<br><br>
<input type="button" value="zamknij okno" onclick="window.close()" />
</body>
</html>
